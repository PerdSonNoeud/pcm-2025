[versions]
kotlin = "2.2.21"
agp = "8.13.1"
ksp = "2.2.20-2.0.4"
foundationLayout = "1.9.5"

[libraries]
room-runtime = { module = "androidx.room:room-runtime", version = "2.8.3" }
room-ktx     = { module = "androidx.room:room-ktx",     version = "2.8.3" }
room-compiler= { module = "androidx.room:room-compiler",version = "2.8.3" }

lifecycle-runtime-ktx      = { module = "androidx.lifecycle:lifecycle-runtime-ktx",      version = "2.9.4" }
lifecycle-viewmodel-compose= { module = "androidx.lifecycle:lifecycle-viewmodel-compose",version = "2.9.4" }
coroutines-android         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }

compose-bom        = { module = "androidx.compose:compose-bom", version = "2025.11.00" }
compose-ui         = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3  = { module = "androidx.compose.material3:material3" }

activity-compose   = { module = "androidx.activity:activity-compose", version = "1.11.0" }
core-ktx           = { module = "androidx.core:core-ktx", version = "1.17.0" }
foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }

[plugins]
androidApplication = { id = "com.android.application",         version.ref = "agp" }
kotlinAndroid      = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
ksp                = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
composeCompiler    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }